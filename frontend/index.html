<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灵感放大器</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <style>
        /* 流动的01数字流背景 */
        body {
            font-family: Arial, sans-serif;
            background-color: #000;
            color: #fff;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        
        #matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.3;
        }
        
        .container {
            max-width: 1000px;
            margin-top: 50px;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(30, 136, 229, 0.5);
        }
        
        .card {
            background-color: rgba(30, 30, 30, 0.8);
            border: 1px solid #1E88E5;
            box-shadow: 0 4px 6px rgba(30, 136, 229, 0.3);
        }
        
        .card-header {
            background-color: rgba(30, 136, 229, 0.8);
            border-bottom: 1px solid #1E88E5;
        }
        
        .btn-primary {
            background-color: #1E88E5;
            border-color: #1E88E5;
        }
        
        .btn-primary:hover {
            background-color: #1976D2;
            border-color: #1976D2;
        }
        
        .btn-secondary {
            background-color: #FF9800;
            border-color: #FF9800;
        }
        
        .btn-secondary:hover {
            background-color: #F57C00;
            border-color: #F57C00;
        }
        
        .form-control {
            resize: vertical;
            min-height: 100px;
            background-color: rgba(50, 50, 50, 0.8);
            border: 1px solid #1E88E5;
            color: #fff;
        }
        
        .form-control::placeholder {
            color: #aaa;
        }
        
        .form-label {
            color: #fff;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .spinner {
            border: 4px solid rgba(30, 136, 229, 0.3);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #1E88E5;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .result-card {
            margin-top: 20px;
        }
        
        .result-table {
            width: 100%;
            border-collapse: collapse;
            background-color: rgba(30, 30, 30, 0.8);
        }
        
        .result-table th, .result-table td {
            border: 1px solid #1E88E5;
            padding: 12px;
            text-align: left;
        }
        
        .result-table th {
            background-color: rgba(30, 136, 229, 0.6);
            color: #fff;
            font-weight: bold;
        }
        
        .result-table tr:nth-child(even) {
            background-color: rgba(50, 50, 50, 0.8);
        }
        
        .result-table tr:hover {
            background-color: rgba(30, 136, 229, 0.2);
        }
        
        .export-buttons {
            margin-top: 20px;
        }
        
        .model-select {
            margin-bottom: 20px;
        }
        
        .form-select {
            background-color: rgba(50, 50, 50, 0.8);
            border: 1px solid #1E88E5;
            color: #fff;
        }
        
        .form-select option {
            background-color: #333;
            color: #fff;
        }
        
        .modal-content {
            background-color: rgba(30, 30, 30, 0.95);
            border: 1px solid #1E88E5;
            color: #fff;
        }
        
        .modal-header {
            border-bottom: 1px solid #1E88E5;
        }
        
        .modal-footer {
            border-top: 1px solid #1E88E5;
        }
        
        pre {
            background-color: rgba(50, 50, 50, 0.8);
            border: 1px solid #1E88E5;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <!-- 流动的01数字流背景 -->
    <canvas id="matrix-bg"></canvas>
    
    <div class="container">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h1 class="text-center">灵感放大器</h1>
                <p class="text-center">将关键词转化为具体可落地的项目方案</p>
            </div>
            <div class="card-body">
                <div class="mb-4">
                    <label for="keywords" class="form-label">输入关键词或关键句（每行一个）</label>
                    <textarea class="form-control" id="keywords" placeholder="例如：
智能垃圾分类
在线教育平台
社区共享工具库"></textarea>
                </div>
                
                <div class="model-select">
                    <label for="model" class="form-label">选择模型</label>
                    <select class="form-select" id="model">
                        <option value="GLM-4.7-Flash">GLM-4.7-Flash</option>
                    </select>
                </div>
                
                <button id="generate-btn" class="btn btn-primary btn-lg btn-block">生成项目方案</button>
                
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p>正在生成项目方案，请稍候...</p>
                </div>
            </div>
        </div>
        
        <div class="result-card card" id="result-card" style="display: none;">
            <div class="card-header bg-secondary text-white">
                <h2 class="text-center">生成结果</h2>
            </div>
            <div class="card-body">
                <div class="export-buttons">
                    <button id="export-excel" class="btn btn-secondary mr-2">导出Excel</button>
                    <button id="export-md" class="btn btn-secondary">导出MD格式</button>
                </div>
                
                <div class="mt-4">
                    <table class="result-table">
                        <thead>
                            <tr>
                                <th>关键词</th>
                                <th>项目方案</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="result-body">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 方案详情模态框 -->
    <div class="modal fade" id="plan-modal" tabindex="-1" aria-labelledby="plan-modal-label" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="plan-modal-label">项目方案详情</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="plan-details">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 全局变量存储生成的结果
        let generatedResults = [];
        
        // 生成项目方案
        document.getElementById('generate-btn').addEventListener('click', async function() {
            const keywords = document.getElementById('keywords').value.trim().split('\n').filter(item => item.trim() !== '');
            const model = document.getElementById('model').value;
            
            if (keywords.length === 0) {
                alert('请输入关键词');
                return;
            }
            
            // 显示加载状态
            document.getElementById('loading').style.display = 'block';
            document.getElementById('generate-btn').disabled = true;
            
            try {
                const response = await fetch('http://localhost:5000/api/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ keywords, model })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    generatedResults = result.data;
                    displayResults(result.data);
                    document.getElementById('result-card').style.display = 'block';
                } else {
                    alert('生成失败：' + result.error);
                }
            } catch (error) {
                alert('生成失败：' + error.message);
            } finally {
                // 隐藏加载状态
                document.getElementById('loading').style.display = 'none';
                document.getElementById('generate-btn').disabled = false;
            }
        });
        
        // 显示结果
        function displayResults(results) {
            const tbody = document.getElementById('result-body');
            tbody.innerHTML = '';
            
            results.forEach((item, index) => {
                const row = document.createElement('tr');
                
                // 关键词列
                const keywordCell = document.createElement('td');
                keywordCell.textContent = item.keyword;
                row.appendChild(keywordCell);
                
                // 项目方案列（显示前100个字符）
                const planCell = document.createElement('td');
                const planPreview = item.project_plan.substring(0, 100) + (item.project_plan.length > 100 ? '...' : '');
                planCell.textContent = planPreview;
                row.appendChild(planCell);
                
                // 操作列
                const actionCell = document.createElement('td');
                const viewBtn = document.createElement('button');
                viewBtn.className = 'btn btn-sm btn-primary';
                viewBtn.textContent = '查看详情';
                viewBtn.onclick = () => showPlanDetails(index);
                actionCell.appendChild(viewBtn);
                row.appendChild(actionCell);
                
                tbody.appendChild(row);
            });
        }
        
        // 显示方案详情
        function showPlanDetails(index) {
            const item = generatedResults[index];
            const modalBody = document.getElementById('plan-details');
            const modalTitle = document.getElementById('plan-modal-label');
            
            modalTitle.textContent = `项目方案：${item.keyword}`;
            modalBody.innerHTML = `
                <h3>项目方案</h3>
                <pre>${item.project_plan}</pre>
                <h3>MD格式分析</h3>
                <pre>${item.md_content}</pre>
            `;
            
            const modal = new bootstrap.Modal(document.getElementById('plan-modal'));
            modal.show();
        }
        
        // 导出Excel
        document.getElementById('export-excel').addEventListener('click', async function() {
            if (generatedResults.length === 0) {
                alert('没有数据可导出');
                return;
            }
            
            try {
                const response = await fetch('http://localhost:5000/api/export/excel', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ data: generatedResults })
                });
                
                if (response.ok) {
                    const blob = await response.blob();
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `project_plans_${new Date().getTime()}.xlsx`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                } else {
                    const result = await response.json();
                    alert('导出失败：' + result.error);
                }
            } catch (error) {
                alert('导出失败：' + error.message);
            }
        });
        
        // 导出MD
        document.getElementById('export-md').addEventListener('click', async function() {
            if (generatedResults.length === 0) {
                alert('没有数据可导出');
                return;
            }
            
            try {
                const response = await fetch('http://localhost:5000/api/export/md', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ data: generatedResults })
                });
                
                if (response.ok) {
                    const blob = await response.blob();
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `project_plans_${new Date().getTime()}.md`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                } else {
                    const result = await response.json();
                    alert('导出失败：' + result.error);
                }
            } catch (error) {
                alert('导出失败：' + error.message);
            }
        });
    }
    
    // 流动的01数字流背景
    (function() {
        const canvas = document.getElementById('matrix-bg');
        const ctx = canvas.getContext('2d');
        
        // 设置canvas尺寸
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        // 字符集
        const chars = '01';
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        
        // 初始化列位置
        const drops = [];
        for (let i = 0; i < columns; i++) {
            drops[i] = 1;
        }
        
        // 绘制函数
        function draw() {
            // 半透明黑色背景，产生轨迹效果
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 文本样式
            ctx.fillStyle = '#1E88E5';
            ctx.font = fontSize + 'px monospace';
            
            // 逐列绘制
            for (let i = 0; i < drops.length; i++) {
                // 随机字符
                const text = chars[Math.floor(Math.random() * chars.length)];
                // 绘制字符
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                
                // 重置位置
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                
                // 下落
                drops[i]++;
            }
        }
        
        // 动画循环
        setInterval(draw, 33);
        
        // 响应窗口大小变化
        window.addEventListener('resize', function() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    })();
    </script>
</body>
</html>
